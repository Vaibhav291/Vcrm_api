# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Vcrm-api

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  migrate-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SqlServer PowerShell module
        shell: pwsh
        run: Install-Module -Name SqlServer -Force -AllowClobber -Scope CurrentUser -MinimumVersion 22.2.0

      - name: Ensure schema version history table exists
        shell: pwsh
        env:
          CONN: ${{ secrets.DEV_DB_CONNECTION_STRING }}
        run: |
          Import-Module SqlServer
          Invoke-Sqlcmd -ConnectionString $env:CONN -Query "IF OBJECT_ID(N'dbo.SchemaVersionHistory', N'U') IS NULL CREATE TABLE dbo.SchemaVersionHistory (ScriptName NVARCHAR(255) NOT NULL CONSTRAINT PK_SchemaVersionHistory PRIMARY KEY, AppliedAtUtc DATETIME2 NOT NULL);"

      - name: Run pending SQL scripts from manifest
        shell: pwsh
        env:
          CONN: ${{ secrets.DEV_DB_CONNECTION_STRING }}
          MANIFEST_PATH: Vcrm/SqlScripts/db-dev-migration.json
          SCRIPTS_DIR: Vcrm/SqlScripts
        run: |
          Import-Module SqlServer

          $manifest = Get-Content -Path $env:MANIFEST_PATH -Raw | ConvertFrom-Json

          foreach ($name in $manifest.files) {
            $scriptPath = Join-Path $env:SCRIPTS_DIR $name

            if (-not (Test-Path $scriptPath)) {
              Write-Error "Manifest references '$name' but no such file exists at $scriptPath"
              exit 1
            }

            $result = Invoke-Sqlcmd -ConnectionString $env:CONN -Query "SELECT COUNT(*) AS Cnt FROM dbo.SchemaVersionHistory WHERE ScriptName = '$name'"

            if ($result.Cnt -eq 0) {
              Write-Host "Applying $name"
              Invoke-Sqlcmd -ConnectionString $env:CONN -InputFile $scriptPath
              Invoke-Sqlcmd -ConnectionString $env:CONN -Query "INSERT INTO dbo.SchemaVersionHistory (ScriptName, AppliedAtUtc) VALUES ('$name', SYSUTCDATETIME());"
              Write-Host "Applied $name"
            } else {
              Write-Host "Skipping $name (already applied)"
            }
          }

  build:
    runs-on: ubuntu-latest
    needs: migrate-db
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A4E9AAB88B4846A4820625746D45BEA4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7CEEC1FB9B414299979628126043EC3E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DBD60EE6C43347B38280EB168903AF1F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Vcrm-api'
          slot-name: 'Production'
          package: .
