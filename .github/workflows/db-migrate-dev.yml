name: Migrate Dev Database

on:
  push:
    branches:
      - develop
    paths:
      - 'Vcrm/Migrations/**'
      - '.github/workflows/db-migrate-dev.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply migrations to Dev database
        working-directory: Vcrm
        run: dotnet ef database update --connection "${{ secrets.DEV_DB_CONNECTION_STRING }}"
